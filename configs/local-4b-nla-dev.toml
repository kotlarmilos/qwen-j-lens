name = "qwen3-4b-nla-local-development"
seed = 20260712

[model]
id = "Qwen/Qwen3-4B-Instruct-2507"
revision = "cdbee75f17c01a7cc42f958dc650907174af0554"
local_files_only = true
dtype = "bfloat16"
# device_map omitted: load fully resident on CPU (no accelerate disk offload)

# hidden-state index. 0 is the embedding output; k is the residual stream after
# block k. This development configuration reads a single mid-stack layer.
[activations]
layer = 18
corpus_path = "data/calibration_prompts.jsonl"
max_prompts = 8
batch_size = 1

# The discrete code stands in for the words a language-model verbalizer emits.
# code_length symbols over code_vocab entries form the natural-language bottleneck.
[autoencoder]
code_length = 4
code_vocab = 64
width = 256
embedding_dim = 32
temperature = 1.0

[train]
steps = 600
lr = 0.01
batch_size = 128
entropy_weight = 0.01

# The independent reader trains on a disjoint split to expose co-adapted private
# codes. gap_threshold and retained_threshold turn the audit into flags.
[faithfulness]
test_fraction = 0.5
reader_steps = 300
reader_lr = 0.05
reader_width = 64
reader_embedding_dim = 16
gap_threshold = 0.2
retained_threshold = 0.5
