name = "qwen3-8b-cross-method-publication"
seed = 20260712

[model]
id = "Qwen/Qwen3-8B"
revision = "b968826d9c46dd6066d109eabc6255188de91218"
local_files_only = true
dtype = "bfloat16"
# device_map is set because the 8B weights are resident on a single 48 GiB
# accelerator. The 4B development configuration omits this field and stays on
# CPU, which is the only environment difference between the two runs.
device_map = "auto"

# hidden_state_index selects the matched residual stream both methods read.
# Index 0 is the embedding output; index k is the residual stream after block k.
# The J-lens capture layer is hidden_state_index minus one, so index 25 hooks
# block 24. Block 24 of 36 is the layer preregistered in
# `configs/qwen-publication.toml` before any result was inspected.
[activations]
hidden_state_index = 25
corpus_path = "data/publication_calibration_prompts.jsonl"
max_prompts = 256
batch_size = 1

# The controlled concept bank is identical to the 4B development configuration
# so the two runs score the same directed subset of tokens.
[concepts]
tokens = [
  " truth",
  " false",
  " plan",
  " answer",
  " doubt",
  " safe",
  " cat",
  " dog",
  " France",
  " blue",
  " hammer",
  " C",
  " B",
]

[jlens]
include_future = true
vjp_chunk_size = 32

# The autoencoder settings match the 4B development configuration. Holding the
# method fixed makes model scale the variable under test.
[autoencoder]
code_length = 4
code_vocab = 64
width = 256
embedding_dim = 32
temperature = 1.0

[train]
steps = 600
lr = 0.01
batch_size = 128
entropy_weight = 0.01

# test_fraction holds out rows for both the J-lens fidelity probe and the
# autoencoder gist probe. fidelity_threshold and retention_threshold place each
# concept in one of the four agreement quadrants. Both thresholds match the 4B
# development configuration.
[agreement]
test_fraction = 0.5
fidelity_threshold = 0.5
retention_threshold = 0.5
